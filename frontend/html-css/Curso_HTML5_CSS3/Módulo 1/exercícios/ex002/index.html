<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parágrafos</title>
</head>
<body>
    <h1>Parágrafos e quebras de linhas</h1>
    <hr>
    <p>Isso tudo é um parágrafo, pode colocar qualquer coisa aqui usando a tag &lt;p&gt;e &lt;/p&gt;</p>
    <p>Para quebrar algum lugar específico do texto só usar a tag &lt;br&gt;*, exemplo <br>aqui! </p>
    <p>Vamos adicionar alguns símbolos: &reg;
        &copy;
        &euro;
        &Delta;
        e por ai vai!
    </p>
    <p>Adicionando emoji: &#x1F343;</p>
</body>
</html>
