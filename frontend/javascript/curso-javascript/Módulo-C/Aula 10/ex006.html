<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eventos DOM</title>
    <style>
        div#area{
            background: black;
            color: white;
            font: normal 20pt candara light;
            width: 200px;
            height: 200px;
            line-height: 200px;
            text-align: center;
        }
    </style> 
</head>
<body>
    <div id='area'>
        Interaja...
    </div>

    <script>
        let a = document.getElementById('area')
        a.addEventListener('click', clicar)
        a.addEventListener('mouseenter', entrar)
        a.addEventListener('mouseout', sair)

        function clicar(){ // Clicou na caixa
            a.style.background = 'white' 
            a.style.color = 'black'
            a.innerText = 'Clicou!'
        }
 
        function entrar(){ // Entrou na caixa
            a.style.background = 'grey'
            a.innerText = 'Entrou!'
        }

        function sair(){ // Saiu da caixa
            a.style.background = 'black'
            a.style.color = 'white'
            a.innerText = 'Saiu!'
        }
    </script>
</body>
</html>
