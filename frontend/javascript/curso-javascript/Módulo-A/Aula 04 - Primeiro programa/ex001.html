<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Primeiro programa JavaScript</title>
    <style>
        body {
            background-color: grey;
            color: white;
            font: normal 20pt arial;
        }
        h1 {
            color: red
        }
    </style>
</head>
<body>
    <h1>Olá, mundo!</h1>
    <p>Já me livrei da maldição!</p>
    <script>
        window.alert('Minha primeira mensagem!') // Janela que vai mostrar a mensagem
        window.confirm('Está gostando de JavaScript?') // Janela com botão OK e CANCELAR
        window.prompt('Qual é o seu nome?') // Janela que pergunta o seu nome!
    </script>
</body>
</html>
